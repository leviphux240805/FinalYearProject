# Render Blueprint — lets you spin up the backend + its Postgres database in
# one step via "New +" -> "Blueprint" in the Render dashboard, instead of
# clicking through a manual Web Service form.
#
# Redis is NOT defined here: Render's own Redis/Key Value offering has no
# free tier, so this project uses Upstash (https://upstash.com, free tier)
# instead — create that separately and paste its REDIS_URL in below (see
# the DEPLOY.md notes next to this file).
#
# After the blueprint runs, you still need to fill in the "sync: false"
# secrets below by hand in the Render dashboard (Environment tab) — Render
# deliberately never auto-fills anything marked sync: false, so real secrets
# never end up committed to this file / this public repo.
services:
  - type: web
    name: super-league-backend
    runtime: node
    plan: free
    rootDir: fantasy-backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: super-league-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false # your Vercel URL(s), e.g. https://super-league-fantasy.vercel.app
      - key: REDIS_URL
        sync: false # from Upstash — see comment above
      - key: SPORTMONKS_API_TOKEN
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false

databases:
  - name: super-league-db
    plan: free
    databaseName: fantasy_db
    user: fantasy_admin
